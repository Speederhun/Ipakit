[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipakit"
version = "0.1.0"
description = "Install and auto-renew unsigned .ipa files on iPhone from Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pymobiledevice3>=4.0",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ipakit = "ipakit.cli:main"
ipakit-gui = "ipakit.gui:main"

[tool.setuptools.packages.find]
include = ["ipakit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
